name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright, axe, keyboard, 375 px)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run e2e
        env:
          CI: 'true'
          PW_CHANNEL: chromium
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The production image: the built app on unprivileged nginx, talking to the real stack on its own origin (the
  # compose's edge proxies /api and /realms/assay). Built on every run and scanned with Trivy: the full report goes to
  # GitHub code scanning, and the job fails on any HIGH or CRITICAL finding that has a fix (accepted unfixable ones are
  # listed in .trivyignore). Only the default branch pushes it, to ghcr.io/firaskhalife/fyp-grading-frontend with the
  # tags latest and the short commit SHA, an SBOM and build provenance, and signs it with cosign (keyless, GitHub
  # OIDC). The scan covers amd64 (the demo host); the pushed image is also arm64, which costs nothing extra because the
  # app is built once, natively (see the Dockerfile).
  image:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write         # push to GHCR
      security-events: write  # upload the scan to code scanning
      id-token: write         # cosign keyless signing
    env:
      IMAGE: ghcr.io/firaskhalife/${{ github.event.repository.name }}
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ env.PUSH }}
            type=sha,prefix=,format=short

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          build-args: |
            VITE_API_MOCKING=off
            VITE_OIDC_AUTHORITY=/realms/assay
            VITE_OIDC_CLIENT_ID=assay-spa
            VITE_DEMO_PASSWORD=assay-demo
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan (every finding, for code scanning)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD:/src" -w /src \
            "$TRIVY" image --scanners vuln --ignorefile .trivyignore --format sarif --output trivy.sarif "$IMAGE:scan"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: image

      - name: No fixable HIGH or CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD:/src" -w /src \
            "$TRIVY" image --scanners vuln --ignorefile .trivyignore --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 "$IMAGE:scan"

      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build from the cache, pushed with an SBOM and max-mode provenance.
      - id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_MOCKING=off
            VITE_OIDC_AUTHORITY=/realms/assay
            VITE_OIDC_CLIENT_ID=assay-spa
            VITE_DEMO_PASSWORD=assay-demo
          cache-from: type=gha

      - if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign (cosign keyless)
        if: env.PUSH == 'true'
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
